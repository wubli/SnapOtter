name: Publish Convert image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: convert-image-${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk for the native conversion engines
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Set image name
        id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snapotter-convert" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            SNAPOTTER_ANALYTICS=off
            AMD64_RUNTIME_BASE=libheif-base-amd64
          cache-from: type=registry,ref=ghcr.io/snapotter-hq/snapotter:cache-linux-amd64

      - name: Show immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'SNAPOTTER_IMAGE=%s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      # Newly created GHCR packages can be private even for a public repository.
      # In that case transfer the exact built image without a registry token on the VM.
      - name: Check anonymous image access
        id: access
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/no-registry-credentials"
          if docker --config "$RUNNER_TEMP/no-registry-credentials" manifest inspect "$IMAGE@$DIGEST" >/dev/null 2>&1; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export image for credential-free deployment
        if: steps.access.outputs.public == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx prune --all --force
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE:sha-$GITHUB_SHA"
          docker save "$IMAGE:sha-$GITHUB_SHA" | zstd -T0 -1 > "$RUNNER_TEMP/convert-image.tar.zst"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.access.outputs.public == 'false'
        with:
          name: convert-image
          path: ${{ runner.temp }}/convert-image.tar.zst
          compression-level: 0
          retention-days: 1
